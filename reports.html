<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>التقارير</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-100 p-6 font-sans">
  <div class="max-w-7xl mx-auto">
    <div class="flex flex-wrap gap-4 items-center mb-6">
      <h1 class="text-2xl font-bold"><i class="fas fa-chart-pie"></i> التقارير</h1>
      <select class="border p-2 rounded-lg"><option>اليوم</option><option>آخر أسبوع</option><option>الشهر</option></select>
      <button class="bg-white border px-4 py-2 rounded-lg"><i class="fas fa-download"></i> تصدير</button>
    </div>
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
      <div class="bg-white p-4 rounded-xl shadow"><canvas id="dailySales" height="200"></canvas></div>
      <div class="bg-white p-4 rounded-xl shadow"><h3 class="font-bold mb-4">المنتجات الأكثر مبيعاً</h3>
        <ol class="space-y-2"><li>برجر <span class="float-left">120</span></li><li>بيبسي <span class="float-left">98</span></li></ol>
      </div>
    </div>
  </div>
  <script>
    new Chart(document.getElementById('dailySales'), { type: 'bar', data: { labels: ['فطور','غداء','عشاء'], datasets: [{label:'مبيعات',data:[200,450,300]}] } });
  </script>
</body>
</html>
