<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>نظام المطاعم</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Tajawal', sans-serif; height: 100vh; overflow: hidden; }
    .qty-btn { width: 28px; height: 28px; border-radius: 50%; border: 1px solid #d1d5db; background: white; cursor: pointer; }
    .qty-btn:active { background: #6366f1; color: white; }
    .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 50; }
    .modal-content { background: white; border-radius: 20px; padding: 24px; width: 90%; max-width: 500px; }
  </style>
</head>
<body class="bg-gray-100">

  <header id="appHeader" class="bg-white shadow-sm px-6 py-4 flex items-center justify-between hidden">
    <h1 class="text-xl font-bold" id="headerTitle">الرئيسية</h1>
    <div class="flex items-center gap-3">
      <button id="langToggleBtn" class="bg-gray-200 px-3 py-2 rounded-lg text-sm">
        <i class="fas fa-globe"></i> <span id="langLabel">English</span>
      </button>
      <button id="logoutBtn" class="text-red-500"><i class="fas fa-sign-out-alt"></i></button>
    </div>
  </header>

  <main id="pageContainer" class="flex-1 overflow-y-auto" style="height: calc(100vh - 64px);"></main>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
