<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>نظام المطاعم - Restaurant POS</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Tajawal', 'Cairo', 'sans-serif'] }
        }
      }
    }
  </script>

  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- Google Fonts (Tajawal for Arabic) -->
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">

  <style>
    body { font-family: 'Tajawal', sans-serif; }
    .page { display: none; }
    .page.active { display: flex; flex-direction: column; height: 100%; }
    .nav-link.active { background-color: #3730a3; }
    .product-card:active { transform: scale(0.96); background-color: #eef2ff; }
    .order-new { border-left-color: #f59e0b; background-color: #fffbeb; }
    .order-preparing { border-left-color: #3b82f6; background-color: #eff6ff; }
    .order-ready { border-left-color: #10b981; background-color: #d1fae5; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .fade-in { animation: fadeIn 0.3s ease; }
  </style>
</head>
<body class="bg-gray-100 h-screen flex flex-col overflow-hidden">

  <!-- ========== الهيدر (يظهر بعد تسجيل الدخول) ========== -->
  <header class="bg-white shadow-sm px-4 py-3 flex items-center justify-between flex-shrink-0" id="appHeader" style="display: none;">
    <div class="flex items-center gap-4">
      <h1 class="text-xl font-bold text-gray-800" id="headerTitle">لوحة التحكم</h1>
      <span class="bg-green-100 text-green-800 px-3 py-1 rounded-full text-sm font-medium">﷼ SAR</span>
    </div>
    <div class="flex items-center gap-3">
      <button onclick="toggleLang()" class="bg-gray-200 hover:bg-gray-300 px-3 py-2 rounded-lg text-sm font-medium transition flex items-center gap-1">
        <i class="fas fa-globe"></i> <span id="langLabel">English</span>
      </button>
      <button onclick="toggleSidebar()" class="md:hidden text-gray-600 hover:text-gray-800 p-2">
        <i class="fas fa-bars text-2xl"></i>
      </button>
      <button onclick="logout()" class="text-red-500 hover:text-red-700 p-2">
        <i class="fas fa-sign-out-alt text-xl"></i>
      </button>
    </div>
  </header>

  <!-- ========== المحتوى الرئيسي (شريط جانبي + صفحة) ========== -->
  <div class="flex flex-1 overflow-hidden">
    
    <!-- الشريط الجانبي -->
    <aside id="sidebar" class="w-64 bg-indigo-900 text-white flex flex-col flex-shrink-0 transition-all duration-300" style="display: none;">
      <div class="p-5 text-center border-b border-indigo-800">
        <i class="fas fa-utensils text-3xl mb-2"></i>
        <h2 class="font-bold text-lg">مطعم العائلة</h2>
      </div>
      <nav class="flex-1 space-y-1 p-3 overflow-y-auto">
        <a href="#dashboard" class="nav-link flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-indigo-800 transition">
          <i class="fas fa-th-large"></i> <span>الرئيسية</span>
        </a>
        <a href="#pos" class="nav-link flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-indigo-800 transition">
          <i class="fas fa-cash-register"></i> <span>الكاشير</span>
        </a>
        <a href="#kitchen" class="nav-link flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-indigo-800 transition">
          <i class="fas fa-fire"></i> <span>المطبخ</span>
        </a>
        <a href="#inventory" class="nav-link flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-indigo-800 transition">
          <i class="fas fa-boxes"></i> <span>المخزون</span>
        </a>
        <a href="#reports" class="nav-link flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-indigo-800 transition">
          <i class="fas fa-chart-bar"></i> <span>التقارير</span>
        </a>
        <a href="#settings" class="nav-link flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-indigo-800 transition">
          <i class="fas fa-cog"></i> <span>الإعدادات</span>
        </a>
        <a href="#qrmenu" class="nav-link flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-indigo-800 transition">
          <i class="fas fa-qrcode"></i> <span>قائمة QR</span>
        </a>
      </nav>
    </aside>

    <!-- حاوية الصفحات -->
    <main class="flex-1 overflow-y-auto bg-gray-50" id="pageContainer">
      <!-- الصفحات ستُعرض هنا ديناميكيًا -->
    </main>
  </div>

  <!-- مكتبات JavaScript -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

  <script>
    // ========== الحالة العامة ==========
    const State = {
      loggedIn: true, // محاكاة تسجيل دخول (نبدأ مباشرة)
      currentPage: 'dashboard',
      language: 'ar',
      cart: [],
      orders: [],
      inventory: [
        { id: 1, name: 'لحم بقري', qty: 12.5, unit: 'كغم', min: 5 },
        { id: 2, name: 'زيت قلي', qty: 2, unit: 'لتر', min: 10 },
        { id: 3, name: 'خبز', qty: 50, unit: 'حبة', min: 20 },
      ],
      kitchenOrders: [
        { id: 101, items: ['برجر دجاج x2', 'بطاطس مقلية'], status: 'new', time: 'منذ 3 دقائق' },
        { id: 102, items: ['بيتزا مارغريتا'], status: 'new', time: 'منذ 1 دقيقة' },
      ]
    };

    // ========== دوال مساعدة ==========
    function setActiveNav(page) {
      document.querySelectorAll('.nav-link').forEach(link => {
        link.classList.toggle('active', link.getAttribute('href') === `#${page}`);
      });
      document.getElementById('headerTitle').textContent = getPageTitle(page);
      State.currentPage = page;
      window.location.hash = page;
      // إغلاق الشريط الجانبي في الموبايل تلقائياً
      if (window.innerWidth < 768) {
        document.getElementById('sidebar').style.display = 'none';
      }
    }

    function getPageTitle(page) {
      const titles = { dashboard: 'الرئيسية', pos: 'الكاشير', kitchen: 'المطبخ', inventory: 'المخزون', reports: 'التقارير', settings: 'الإعدادات', qrmenu: 'قائمة QR' };
      return titles[page] || page;
    }

    function navigateTo(page) {
      if (!State.loggedIn && page !== 'login') {
        page = 'login';
      }
      setActiveNav(page);
      renderPage(page);
    }

    function renderPage(page) {
      const container = document.getElementById('pageContainer');
      container.innerHTML = ''; // مسح المحتوى
      container.classList.add('fade-in');
      setTimeout(() => container.classList.remove('fade-in'), 300);

      switch(page) {
        case 'dashboard': renderDashboard(container); break;
        case 'pos': renderPOS(container); break;
        case 'kitchen': renderKitchen(container); break;
        case 'inventory': renderInventory(container); break;
        case 'reports': renderReports(container); break;
        case 'settings': renderSettings(container); break;
        case 'qrmenu': renderQRMenu(container); break;
        default: renderDashboard(container);
      }
    }

    // ========== عرض الصفحات (كل دالة تبني HTML وتضبط الأحداث) ==========
    
    function renderDashboard(container) {
      container.innerHTML = `
        <div class="p-6">
          <h2 class="text-2xl font-bold mb-6">لوحة التحكم</h2>
          <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
            <div class="bg-white p-4 rounded-xl shadow"><span class="text-gray-500">مبيعات اليوم</span><h3 class="text-2xl font-bold text-green-600">1,250 ﷼</h3></div>
            <div class="bg-white p-4 rounded-xl shadow"><span class="text-gray-500">الطلبات</span><h3 class="text-2xl font-bold">34</h3></div>
            <div class="bg-white p-4 rounded-xl shadow"><span class="text-gray-500">متوسط الطلب</span><h3 class="text-2xl font-bold">36.7 ﷼</h3></div>
            <div class="bg-white p-4 rounded-xl shadow"><span class="text-gray-500">تنبيهات المخزون</span><h3 class="text-2xl font-bold text-red-500">2</h3></div>
          </div>
          <div class="grid grid-cols-1 lg:grid-cols-3 gap-4">
            <div class="lg:col-span-2 bg-white p-4 rounded-xl shadow">
              <canvas id="salesChart" height="200"></canvas>
            </div>
            <div class="bg-white p-4 rounded-xl shadow">
              <h3 class="font-bold mb-3">أحدث الطلبات</h3>
              <div class="space-y-2 text-sm">
                <div class="flex justify-between"><span>طلب #103</span><span class="text-green-600">45 ﷼</span></div>
                <div class="flex justify-between"><span>طلب #102</span><span class="text-green-600">120 ﷼</span></div>
                <div class="flex justify-between"><span>طلب #101</span><span class="text-green-600">75 ﷼</span></div>
              </div>
            </div>
          </div>
        </div>
      `;
      // رسم بياني بسيط
      setTimeout(() => {
        const ctx = document.getElementById('salesChart');
        if (ctx) {
          new Chart(ctx, {
            type: 'line',
            data: {
              labels: ['السبت', 'الأحد', 'الإثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة'],
              datasets: [{ label: 'مبيعات (﷼)', data: [800, 950, 1200, 1100, 1400, 1250, 900], borderColor: '#6366f1' }]
            }
          });
        }
      }, 100);
    }

    // --- الكاشير ---
    function renderPOS(container) {
      container.innerHTML = `
        <div class="flex h-full">
          <div class="flex-1 flex flex-col">
            <div class="p-3 bg-white shadow flex gap-2 flex-wrap">
              <select id="orderType" class="border rounded p-2">
                <option value="dine_in">داخل المطعم</option>
                <option value="takeaway">تيك أواي</option>
                <option value="delivery">دليفري</option>
              </select>
              <input type="text" id="tableNo" placeholder="رقم الطاولة" class="border rounded p-2 w-24">
              <input type="text" id="customerName" placeholder="اسم العميل" class="border rounded p-2 flex-1 min-w-[120px]">
            </div>
            <div id="productGrid" class="flex-1 overflow-y-auto p-4 grid grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-3"></div>
          </div>
          <div class="w-96 bg-white border-r flex flex-col">
            <div class="p-4 border-b flex justify-between items-center">
              <h2 class="font-bold text-lg">الطلب الحالي</h2>
              <button onclick="State.cart=[]; renderCart()" class="text-red-500 hover:text-red-700"><i class="fas fa-trash"></i></button>
            </div>
            <div id="cartContainer" class="flex-1 overflow-y-auto p-4 space-y-3"></div>
            <div class="border-t p-4 bg-gray-50">
              <div class="flex justify-between font-bold text-lg mb-2"><span>الإجمالي</span><span id="totalDisplay">0.00 ﷼</span></div>
              <div class="grid grid-cols-3 gap-2 mb-3">
                <button onclick="quickPay('cash')" class="bg-green-600 text-white p-2 rounded-lg text-sm font-medium hover:bg-green-700"><i class="fas fa-money-bill"></i> نقداً</button>
                <button onclick="quickPay('visa')" class="bg-blue-600 text-white p-2 rounded-lg text-sm font-medium hover:bg-blue-700"><i class="fab fa-cc-visa"></i> Visa</button>
                <button onclick="quickPay('wallet')" class="bg-purple-600 text-white p-2 rounded-lg text-sm font-medium hover:bg-purple-700"><i class="fas fa-wallet"></i> محفظة</button>
              </div>
              <button onclick="placeOrder()" class="w-full bg-indigo-600 text-white py-3 rounded-xl font-bold hover:bg-indigo-700 transition disabled:bg-gray-400" id="placeOrderBtn" disabled>إتمام الطلب</button>
            </div>
          </div>
        </div>
      `;
      loadProducts();
      renderCart();
    }

    const demoProducts = [
      { id: 1, name: 'برجر دجاج', price: 25, category: 'وجبات رئيسية' },
      { id: 2, name: 'برجر لحم', price: 30, category: 'وجبات رئيسية' },
      { id: 3, name: 'بطاطس مقلية', price: 10, category: 'مقبلات' },
      { id: 4, name: 'كولا', price: 5, category: 'مشروبات' },
      { id: 5, name: 'عصير برتقال', price: 8, category: 'مشروبات' },
      { id: 6, name: 'بيتزا مارغريتا', price: 35, category: 'وجبات رئيسية' },
      { id: 7, name: 'سلطة سيزر', price: 15, category: 'مقبلات' },
      { id: 8, name: 'ماء', price: 2, category: 'مشروبات' }
    ];

    function loadProducts() {
      const grid = document.getElementById('productGrid');
      if (!grid) return;
      grid.innerHTML = demoProducts.map(p => `
        <div class="product-card bg-white rounded-xl shadow p-4 text-center cursor-pointer hover:bg-indigo-50 transition border-2 border-transparent hover:border-indigo-400" onclick="addToCart(${p.id}, '${p.name}', ${p.price})">
          <div class="text-lg font-bold">${p.name}</div>
          <div class="text-green-600 font-bold mt-2">${p.price} ﷼</div>
        </div>
      `).join('');
    }

    window.addToCart = function(id, name, price) {
      const existing = State.cart.find(item => item.id === id);
      if (existing) {
        existing.qty++;
      } else {
        State.cart.push({ id, name, price, qty: 1 });
      }
      renderCart();
    };

    window.changeQty = function(id, delta) {
      const item = State.cart.find(i => i.id === id);
      if (!item) return;
      item.qty += delta;
      if (item.qty <= 0) State.cart = State.cart.filter(i => i.id !== id);
      renderCart();
    };

    function renderCart() {
      const container = document.getElementById('cartContainer');
      const totalEl = document.getElementById('totalDisplay');
      const placeBtn = document.getElementById('placeOrderBtn');
      if (!container) return;
      if (State.cart.length === 0) {
        container.innerHTML = '<p class="text-gray-400 text-center mt-8">السلة فارغة</p>';
        if (totalEl) totalEl.textContent = '0.00 ﷼';
        if (placeBtn) placeBtn.disabled = true;
        return;
      }
      container.innerHTML = State.cart.map(item => `
        <div class="flex justify-between items-center bg-gray-100 rounded-lg p-3">
          <div>
            <div class="font-medium">${item.name}</div>
            <div class="text-sm text-gray-500">${item.price} ﷼ × ${item.qty}</div>
          </div>
          <div class="flex items-center gap-2">
            <button onclick="changeQty(${item.id}, -1)" class="bg-white border rounded-full w-7 h-7 flex items-center justify-center">-</button>
            <span class="font-bold">${item.qty}</span>
            <button onclick="changeQty(${item.id}, 1)" class="bg-white border rounded-full w-7 h-7 flex items-center justify-center">+</button>
          </div>
        </div>
      `).join('');
      const total = State.cart.reduce((sum, i) => sum + i.price * i.qty, 0);
      if (totalEl) totalEl.textContent = `${total.toFixed(2)} ﷼`;
      if (placeBtn) placeBtn.disabled = false;
    }

    window.placeOrder = function() {
      if (State.cart.length === 0) return;
      // إضافة الطلب إلى قائمة المطبخ
      const newOrder = {
        id: Math.floor(Math.random() * 1000) + 200,
        items: State.cart.map(i => `${i.name} x${i.qty}`),
        status: 'new',
        time: 'الآن'
      };
      State.kitchenOrders.unshift(newOrder);
      alert('تم إرسال الطلب إلى المطبخ!');
      State.cart = [];
      renderCart();
    };

    window.quickPay = function(method) {
      if (State.cart.length === 0) return;
      placeOrder(); // يرسل الطلب ثم يدفع
      alert(`تم الدفع ${method === 'cash' ? 'نقداً' : method === 'visa' ? 'ببطاقة ائتمان' : 'بمحفظة إلكترونية'} بنجاح`);
    };

    // --- المطبخ ---
    function renderKitchen(container) {
      container.innerHTML = `
        <div class="p-6">
          <h2 class="text-2xl font-bold mb-6">شاشة المطبخ</h2>
          <div id="kitchenOrdersContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
        </div>
      `;
      renderKitchenOrders();
    }

    function renderKitchenOrders() {
      const container = document.getElementById('kitchenOrdersContainer');
      if (!container) return;
      container.innerHTML = State.kitchenOrders.map(order => `
        <div class="bg-white rounded-xl shadow p-4 border-r-4 ${order.status === 'new' ? 'order-new' : order.status === 'preparing' ? 'order-preparing' : 'order-ready'} transition">
          <div class="flex justify-between items-start mb-3">
            <h3 class="font-bold text-lg">طلب #${order.id}</h3>
            <span class="text-xs text-gray-500">${order.time}</span>
          </div>
          <ul class="list-disc list-inside text-sm mb-4">
            ${order.items.map(item => `<li>${item}</li>`).join('')}
          </ul>
          <div class="flex gap-2">
            ${order.status === 'new' ? `<button onclick="updateKitchenStatus(${order.id}, 'preparing')" class="flex-1 bg-blue-600 text-white py-2 rounded-lg">بدء التحضير</button>` : ''}
            ${order.status === 'preparing' ? `<button onclick="updateKitchenStatus(${order.id}, 'ready')" class="flex-1 bg-green-600 text-white py-2 rounded-lg">جاهز</button>` : ''}
            ${order.status === 'ready' ? `<span class="text-green-600 font-bold">تم التسليم</span>` : ''}
          </div>
        </div>
      `).join('');
      if (State.kitchenOrders.length === 0) {
        container.innerHTML = '<p class="text-gray-400 text-center mt-8">لا توجد طلبات حالياً</p>';
      }
    }

    window.updateKitchenStatus = function(orderId, newStatus) {
      const order = State.kitchenOrders.find(o => o.id === orderId);
      if (order) {
        order.status = newStatus;
        if (newStatus === 'ready') order.time = 'جاهز';
        renderKitchenOrders();
      }
    };

    // --- المخزون ---
    function renderInventory(container) {
      container.innerHTML = `
        <div class="p-6">
          <h2 class="text-2xl font-bold mb-6">إدارة المخزون</h2>
          <div class="bg-white rounded-xl shadow overflow-hidden">
            <table class="w-full text-sm">
              <thead class="bg-gray-50">
                <tr><th class="p-3 text-right">المادة</th><th class="p-3">الكمية</th><th class="p-3">الوحدة</th><th class="p-3">الحد الأدنى</th><th class="p-3">الحالة</th></tr>
              </thead>
              <tbody>
                ${State.inventory.map(item => `
                  <tr class="border-t">
                    <td class="p-3 font-medium">${item.name}</td>
                    <td class="p-3 ${item.qty <= item.min ? 'text-red-600 font-bold' : ''}">${item.qty}</td>
                    <td class="p-3">${item.unit}</td>
                    <td class="p-3">${item.min}</td>
                    <td class="p-3">
                      <span class="px-2 py-1 rounded-full text-xs font-medium ${item.qty <= item.min ? 'bg-red-100 text-red-800' : 'bg-green-100 text-green-800'}">
                        ${item.qty <= item.min ? 'منخفض' : 'متوفر'}
                      </span>
                    </td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        </div>
      `;
    }

    // --- التقارير ---
    function renderReports(container) {
      container.innerHTML = `
        <div class="p-6">
          <h2 class="text-2xl font-bold mb-6">التقارير</h2>
          <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
            <div class="bg-white p-4 rounded-xl shadow"><canvas id="reportSalesChart" height="200"></canvas></div>
            <div class="bg-white p-4 rounded-xl shadow">
              <h3 class="font-bold mb-3">المنتجات الأكثر مبيعاً</h3>
              <ol class="list-decimal list-inside space-y-2">
                <li>برجر دجاج - 150 طلب</li>
                <li>كولا - 120 طلب</li>
                <li>بطاطس مقلية - 100 طلب</li>
              </ol>
            </div>
          </div>
        </div>
      `;
      setTimeout(() => {
        const ctx = document.getElementById('reportSalesChart');
        if (ctx) {
          new Chart(ctx, {
            type: 'bar',
            data: {
              labels: ['الأسبوع 1', 'الأسبوع 2', 'الأسبوع 3', 'الأسبوع 4'],
              datasets: [{ label: 'مبيعات (﷼)', data: [3200, 4100, 3800, 4500], backgroundColor: '#6366f1' }]
            }
          });
        }
      }, 100);
    }

    // --- الإعدادات ---
    function renderSettings(container) {
      container.innerHTML = `
        <div class="p-6">
          <h2 class="text-2xl font-bold mb-6">الإعدادات</h2>
          <div class="bg-white rounded-xl shadow p-6 max-w-lg">
            <div class="space-y-4">
              <div><label class="block text-sm font-medium mb-1">اسم المطعم</label><input type="text" value="مطعم العائلة" class="w-full border rounded p-2"></div>
              <div><label class="block text-sm font-medium mb-1">العملة</label><select class="w-full border rounded p-2"><option>SAR</option><option>USD</option></select></div>
              <div><label class="block text-sm font-medium mb-1">نسبة الضريبة %</label><input type="number" value="15" class="w-full border rounded p-2"></div>
              <button class="bg-indigo-600 text-white px-6 py-2 rounded-lg">حفظ</button>
            </div>
          </div>
        </div>
      `;
    }

    // --- قائمة QR ---
    function renderQRMenu(container) {
      container.innerHTML = `
        <div class="p-6">
          <h2 class="text-2xl font-bold mb-6">قائمة QR (تجربة)</h2>
          <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
            ${demoProducts.map(p => `
              <div class="bg-white p-4 rounded-xl shadow text-center">
                <div class="font-bold">${p.name}</div>
                <div class="text-green-600">${p.price} ﷼</div>
                <button class="mt-2 bg-indigo-600 text-white px-4 py-1 rounded-full text-sm">أضف</button>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    // ========== أحداث التنقل ==========
    window.addEventListener('hashchange', () => {
      const page = window.location.hash.slice(1) || 'dashboard';
      navigateTo(page);
    });

    // روابط الشريط الجانبي
    document.addEventListener('click', (e) => {
      const link = e.target.closest('.nav-link');
      if (link) {
        e.preventDefault();
        const page = link.getAttribute('href').slice(1);
        navigateTo(page);
      }
    });

    function toggleSidebar() {
      const sidebar = document.getElementById('sidebar');
      if (sidebar.style.display === 'none' || sidebar.style.display === '') {
        sidebar.style.display = 'flex';
      } else {
        sidebar.style.display = 'none';
      }
    }

    function toggleLang() {
      State.language = State.language === 'ar' ? 'en' : 'ar';
      document.documentElement.lang = State.language;
      document.documentElement.dir = State.language === 'ar' ? 'rtl' : 'ltr';
      document.getElementById('langLabel').textContent = State.language === 'ar' ? 'English' : 'العربية';
      // إعادة عرض الصفحة الحالية (ستحتاج لترجمة كاملة في نسخة حقيقية)
      renderPage(State.currentPage);
    }

    window.logout = function() {
      if (confirm('تسجيل الخروج؟')) {
        // في النسخة الحقيقية: supabase.auth.signOut()
        State.loggedIn = false;
        navigateTo('login');
      }
    };

    // ========== بدء التشغيل ==========
    window.onload = () => {
      // محاكاة أن المستخدم دخل بالفعل
      State.loggedIn = true;
      document.getElementById('appHeader').style.display = 'flex';
      document.getElementById('sidebar').style.display = 'flex';
      const startPage = window.location.hash.slice(1) || 'dashboard';
      navigateTo(startPage);
    };
  </script>
</body>
</html>
