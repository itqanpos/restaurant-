<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>R-SaaS</title>
  <!-- Tailwind + Font Awesome -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/main.css">
</head>
<body class="bg-gray-100 h-screen flex flex-col overflow-hidden">

  <!-- شريط العنوان -->
  <header id="appHeader" class="bg-white shadow-sm px-4 py-3 flex items-center justify-between hidden">
    <h1 class="text-xl font-bold" id="headerTitle">الرئيسية</h1>
    <div class="flex items-center gap-3">
      <button id="langToggleBtn" class="bg-gray-200 px-3 py-2 rounded-lg text-sm">
        <i class="fas fa-globe"></i> <span id="langLabel">English</span>
      </button>
      <button id="logoutBtn" class="text-red-500 p-2"><i class="fas fa-sign-out-alt text-xl"></i></button>
    </div>
  </header>

  <!-- منطقة المحتوى الرئيسية -->
  <main id="pageContainer" class="flex-1 overflow-y-auto bg-gray-50 p-4 md:p-6"></main>

  <!-- تحميل التطبيق كنمط Module -->
  <script type="module" src="src/main.js"></script>
</body>
</html>
