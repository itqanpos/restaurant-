<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>نظام المطاعم - Restaurant SaaS</title>

  <!-- Tailwind + Icons + Fonts -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Tajawal', 'Cairo', 'sans-serif'] }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">

  <style>
    /* تنسيقات أساسية للتطبيق */
    body { font-family: 'Tajawal', sans-serif; }
    .page { display: none; }
    .page.active { display: flex; flex-direction: column; height: 100vh; }
    .fade-in { animation: fadeIn 0.3s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body class="bg-gray-100 text-gray-800 h-screen overflow-hidden">

  <!-- ========== الحاوية الرئيسية ========== -->
  <div id="app" class="h-full flex flex-col">

    <!-- شريط التنقل العلوي (يظهر بعد تسجيل الدخول) -->
    <header id="appHeader" class="bg-white shadow px-4 py-3 flex items-center justify-between hidden">
      <div class="flex items-center gap-4">
        <h1 class="text-xl font-bold" id="headerTitle">لوحة التحكم</h1>
        <span class="bg-green-100 text-green-800 px-3 py-1 rounded-full text-sm" id="currencyBadge">﷼ SAR</span>
      </div>
      <div class="flex items-center gap-3">
        <button onclick="toggleLang()" class="bg-gray-200 px-3 py-2 rounded-lg text-sm"><i class="fas fa-globe"></i> <span id="langLabel">English</span></button>
        <button onclick="document.getElementById('sidebar').classList.toggle('hidden')" class="md:hidden"><i class="fas fa-bars text-2xl"></i></button>
        <button onclick="logout()" class="text-red-500 hover:text-red-700"><i class="fas fa-sign-out-alt"></i></button>
      </div>
    </header>

    <div class="flex flex-1 overflow-hidden">
      <!-- الشريط الجانبي (يظهر بعد تسجيل الدخول) -->
      <aside id="sidebar" class="w-64 bg-indigo-900 text-white flex flex-col hidden md:flex transition-all duration-300">
        <div class="p-5 text-center border-b border-indigo-800">
          <i class="fas fa-utensils text-3xl mb-2"></i>
          <h2 class="font-bold" id="restaurantName">مطعم العائلة</h2>
        </div>
        <nav class="flex-1 space-y-1 p-3" id="mainNav">
          <a href="#dashboard" class="nav-link flex items-center gap-3 px-4 py-3 rounded-lg"><i class="fas fa-th-large"></i> الرئيسية</a>
          <a href="#pos" class="nav-link flex items-center gap-3 px-4 py-3 rounded-lg"><i class="fas fa-cash-register"></i> الكاشير</a>
          <a href="#kitchen" class="nav-link flex items-center gap-3 px-4 py-3 rounded-lg"><i class="fas fa-fire"></i> المطبخ</a>
          <a href="#inventory" class="nav-link flex items-center gap-3 px-4 py-3 rounded-lg"><i class="fas fa-boxes"></i> المخزون</a>
          <a href="#reports" class="nav-link flex items-center gap-3 px-4 py-3 rounded-lg"><i class="fas fa-chart-bar"></i> التقارير</a>
          <a href="#settings" class="nav-link flex items-center gap-3 px-4 py-3 rounded-lg"><i class="fas fa-cog"></i> الإعدادات</a>
          <a href="#menu" class="nav-link flex items-center gap-3 px-4 py-3 rounded-lg"><i class="fas fa-qrcode"></i> قائمة QR</a>
        </nav>
      </aside>

      <!-- منطقة المحتوى (تعرض الصفحة النشطة) -->
      <main class="flex-1 overflow-y-auto bg-gray-50" id="mainContent">
        <!-- الصفحات تُنشأ هنا ديناميكياً -->
      </main>
    </div>
  </div>

  <!-- ========== مكتبات خارجية ========== -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/i18next@23.7.8/i18next.min.js"></script>

  <!-- ========== كود التطبيق الكامل ========== -->
  <script>
    // ---------- إعداد Supabase ----------
    const supabaseUrl = 'https://your-project.supabase.co';       // استبدل بمشروعك
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'; // anon key
    const supabase = supabase.createClient(supabaseUrl, supabaseKey);

    // ---------- حالة التطبيق ----------
    const AppState = {
      user: null,
      restaurant: null,
      branch: null,
      language: 'ar',
      currency: 'SAR',
      currentPage: 'login',
      cart: [],
      orderType: 'dine_in',
      tableNumber: '',
      customerName: '',
      currentOrderId: null
    };

    // قاموس الترجمة (مبسط)
    const t = (key) => {
      const dict = {
        ar: { dashboard:'الرئيسية', pos:'الكاشير', kitchen:'المطبخ', inventory:'المخزون', reports:'التقارير', settings:'الإعدادات', menu:'قائمة QR' },
        en: { dashboard:'Dashboard', pos:'POS', kitchen:'Kitchen', inventory:'Inventory', reports:'Reports', settings:'Settings', menu:'QR Menu' }
      };
      return (dict[AppState.language] && dict[AppState.language][key]) || key;
    };

    // ---------- وظائف التوجيه ----------
    function navigateTo(page) {
      if (page !== 'login' && !AppState.user) {
        page = 'login';
      }
      AppState.currentPage = page;
      // تحديث الشريط الجانبي
      document.querySelectorAll('.nav-link').forEach(link => {
        link.classList.toggle('bg-indigo-800', link.getAttribute('href') === '#' + page);
      });
      // عرض الصفحة المناسبة
      const main = document.getElementById('mainContent');
      main.innerHTML = '';
      main.classList.add('fade-in');
      switch(page) {
        case 'login': renderLoginPage(main); break;
        case 'dashboard': renderDashboardPage(main); break;
        case 'pos': renderPOSPage(main); break;
        case 'kitchen': renderKitchenPage(main); break;
        case 'inventory': renderInventoryPage(main); break;
        case 'reports': renderReportsPage(main); break;
        case 'settings': renderSettingsPage(main); break;
        case 'menu': renderMenuPage(main); break;
      }
      // إظهار / إخفاء الهيدر والسايد بار
      const authPages = ['login'];
      const showUI = !authPages.includes(page);
      document.getElementById('appHeader').classList.toggle('hidden', !showUI);
      document.getElementById('sidebar').classList.toggle('hidden', !showUI);
      // تحديث العنوان
      document.getElementById('headerTitle').textContent = t(page) || page;
      window.location.hash = page;
    }

    window.onhashchange = () => {
      const page = window.location.hash.slice(1) || 'login';
      navigateTo(page);
    };

    // ---------- المصادقة ----------
    async function checkAuth() {
      const { data: { session } } = await supabase.auth.getSession();
      if (session?.user) {
        AppState.user = session.user;
        await loadUserRestaurant();
        navigateTo('dashboard');
      } else {
        navigateTo('login');
      }
    }

    async function login(email, password) {
      const { data, error } = await supabase.auth.signInWithPassword({ email, password });
      if (error) return alert(error.message);
      AppState.user = data.user;
      await loadUserRestaurant();
      navigateTo('dashboard');
    }

    async function logout() {
      await supabase.auth.signOut();
      AppState.user = null;
      AppState.restaurant = null;
      navigateTo('login');
    }

    async function loadUserRestaurant() {
      if (!AppState.user) return;
      const { data } = await supabase.from('user_restaurant_roles')
        .select('restaurant_id, restaurants(name), branch_id, branches(currency)')
        .eq('user_id', AppState.user.id)
        .single();
      if (data) {
        AppState.restaurant = data.restaurants;
        AppState.branch = data.branches;
        AppState.currency = data.branches?.currency || 'SAR';
        document.getElementById('restaurantName').textContent = AppState.restaurant?.name || 'المطعم';
        document.getElementById('currencyBadge').textContent = (AppState.currency === 'SAR' ? '﷼' : '$') + ' ' + AppState.currency;
      }
    }

    // ---------- وظائف اللغة ----------
    function toggleLang() {
      AppState.language = AppState.language === 'ar' ? 'en' : 'ar';
      document.documentElement.lang = AppState.language;
      document.documentElement.dir = AppState.language === 'ar' ? 'rtl' : 'ltr';
      document.getElementById('langLabel').textContent = AppState.language === 'ar' ? 'English' : 'العربية';
      navigateTo(AppState.currentPage); // إعادة الرسم لتطبيق الترجمة
    }

    // ========== دوال عرض الصفحات ==========
    // كل دالة renderXXXX تقوم ببناء HTML الصفحة داخل العنصر container

    // --- صفحة تسجيل الدخول ---
    function renderLoginPage(container) {
      container.innerHTML = `
        <div class="flex items-center justify-center h-full bg-gradient-to-br from-indigo-600 to-purple-700">
          <div class="bg-white rounded-3xl shadow-2xl p-8 w-full max-w-md mx-4">
            <div class="text-center mb-8">
              <i class="fas fa-utensils text-5xl text-indigo-600 mb-3"></i>
              <h2 class="text-2xl font-bold">تسجيل الدخول</h2>
              <p class="text-gray-500 mt-2">أهلاً بك في نظام إدارة المطاعم</p>
            </div>
            <form id="loginForm" class="space-y-5" onsubmit="event.preventDefault(); login(document.getElementById('email').value, document.getElementById('password').value)">
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">البريد الإلكتروني</label>
                <input type="email" id="email" required class="w-full px-4 py-3 border border-gray-300 rounded-xl" placeholder="example@restaurant.com">
              </div>
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">كلمة المرور</label>
                <input type="password" id="password" required class="w-full px-4 py-3 border border-gray-300 rounded-xl" placeholder="••••••••">
              </div>
              <button type="submit" class="w-full bg-indigo-600 text-white py-3 rounded-xl font-bold hover:bg-indigo-700">دخول</button>
            </form>
          </div>
        </div>
      `;
    }

    // --- لوحة التحكم ---
    function renderDashboardPage(container) {
      container.innerHTML = `
        <div class="p-6">
          <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">
            <div class="bg-white p-4 rounded-xl shadow"><span class="text-gray-500">مبيعات اليوم</span><h3 class="text-2xl font-bold">1,250 ﷼</h3></div>
            <div class="bg-white p-4 rounded-xl shadow"><span class="text-gray-500">عدد الطلبات</span><h3 class="text-2xl font-bold">34</h3></div>
            <div class="bg-white p-4 rounded-xl shadow"><span class="text-gray-500">متوسط الطلب</span><h3 class="text-2xl font-bold">36.7 ﷼</h3></div>
            <div class="bg-white p-4 rounded-xl shadow"><span class="text-gray-500">تنبيهات المخزون</span><h3 class="text-2xl font-bold text-red-500">5</h3></div>
          </div>
          <div class="grid grid-cols-1 lg:grid-cols-3 gap-4">
            <div class="lg:col-span-2 bg-white p-4 rounded-xl shadow"><canvas id="salesChart" height="200"></canvas></div>
            <div class="bg-white p-4 rounded-xl shadow">
              <h3 class="font-bold mb-3">أحدث الطلبات</h3>
              <div class="space-y-3" id="latestOrders"></div>
            </div>
          </div>
        </div>
      `;
      // رسم بياني وهمي
      setTimeout(() => {
        new Chart(document.getElementById('salesChart'), { type: 'line', data: { labels: ['','',''], datasets: [{label:'مبيعات',data:[12,19,3]}] } });
      }, 100);
    }

    // --- صفحة الكاشير (نسخة محسنة) ---
    function renderPOSPage(container) {
      container.innerHTML = `
        <div class="flex h-full">
          <div class="flex-1 flex flex-col">
            <div class="p-4 bg-white shadow flex gap-2">
              <select id="orderTypeSelect" class="border p-2 rounded-lg">
                <option value="dine_in">داخل المطعم</option>
                <option value="takeaway">تيك أواي</option>
                <option value="delivery">دليفري</option>
              </select>
              <input type="text" id="tableInput" placeholder="رقم الطاولة" class="border p-2 rounded-lg w-24">
              <input type="text" id="customerInput" placeholder="اسم العميل" class="border p-2 rounded-lg">
            </div>
            <div id="productGrid" class="flex-1 overflow-y-auto p-4 grid grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-3"></div>
          </div>
          <div class="w-96 bg-white border-l flex flex-col">
            <div class="p-4 border-b flex justify-between items-center">
              <h2 class="font-bold">الطلب الحالي</h2>
              <button onclick="AppState.cart=[]; updateCartDisplay()" class="text-red-500"><i class="fas fa-trash"></i></button>
            </div>
            <div id="cartContainer" class="flex-1 overflow-y-auto p-4"></div>
            <div class="border-t p-4 bg-gray-50">
              <div class="flex justify-between font-bold text-lg"><span>الإجمالي</span><span id="totalDisplay">0.00</span></div>
              <button onclick="placeOrder()" class="w-full bg-green-600 text-white py-3 rounded-lg mt-2">إتمام الطلب</button>
            </div>
          </div>
        </div>
      `;
      loadProducts();
      updateCartDisplay();
    }

    // باقي الصفحات ستكون مشابهة، سأوجزها لإبقاء الرد ضمن الحجم
    // ... kitchen, inventory, reports, settings, menu بنفس النمط

    // ---------- دوال المساعدة للكاشير (مؤقتة) ----------
    async function loadProducts() {
      // تستخدم supabase.from('products')...
      const products = [
        { id:1, name:'برجر', price:25 },
        { id:2, name:'كولا', price:5 }
      ];
      const grid = document.getElementById('productGrid');
      if (grid) {
        grid.innerHTML = products.map(p => `
          <div class="product-card bg-white p-4 rounded-xl shadow cursor-pointer hover:bg-indigo-50" onclick="addToCart(${p.id},'${p.name}',${p.price})">
            <div class="font-bold">${p.name}</div>
            <div class="text-green-600">${p.price} ﷼</div>
          </div>
        `).join('');
      }
    }

    function addToCart(id, name, price) {
      const existing = AppState.cart.find(i => i.id === id);
      if (existing) existing.qty++;
      else AppState.cart.push({ id, name, price, qty:1 });
      updateCartDisplay();
    }

    function updateCartDisplay() {
      const container = document.getElementById('cartContainer');
      const totalEl = document.getElementById('totalDisplay');
      if (!container) return;
      if (AppState.cart.length === 0) {
        container.innerHTML = '<p class="text-gray-400 text-center">السلة فارغة</p>';
        totalEl.textContent = '0.00';
        return;
      }
      container.innerHTML = AppState.cart.map(item => `
        <div class="flex justify-between items-center bg-gray-100 p-3 rounded-lg mb-2">
          <div><span class="font-medium">${item.name}</span><br><span class="text-sm text-gray-500">${item.price} × ${item.qty}</span></div>
          <div class="flex items-center gap-2">
            <button onclick="changeQty(${item.id}, -1)" class="bg-white border w-6 h-6 rounded-full">-</button>
            <span>${item.qty}</span>
            <button onclick="changeQty(${item.id}, 1)" class="bg-white border w-6 h-6 rounded-full">+</button>
          </div>
        </div>
      `).join('');
      const total = AppState.cart.reduce((sum, i) => sum + i.price * i.qty, 0);
      totalEl.textContent = total.toFixed(2) + ' ﷼';
    }

    function changeQty(id, delta) {
      const item = AppState.cart.find(i => i.id === id);
      if (!item) return;
      item.qty += delta;
      if (item.qty <= 0) AppState.cart = AppState.cart.filter(i => i.id !== id);
      updateCartDisplay();
    }

    async function placeOrder() {
      if (AppState.cart.length === 0) return;
      alert('تم تقديم الطلب (محاكاة)');
      AppState.cart = [];
      updateCartDisplay();
    }

    // ---------- بدء التطبيق ----------
    window.onload = async () => {
      // فحص الجلسة
      await checkAuth();
    };
  </script>
</body>
</html>
