<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>قائمة الطعام</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="bg-gray-50 p-4">
  <div class="max-w-2xl mx-auto">
    <div class="text-center mb-8">
      <img src="logo.png" alt="logo" class="h-16 mx-auto">
      <h1 class="text-2xl font-bold mt-2">مطعم العائلة</h1>
    </div>
    <div class="space-y-4" id="menuItems">
      <div class="bg-white rounded-xl p-4 flex justify-between items-center shadow">
        <div><h3 class="font-bold">برجر دجاج</h3><p class="text-gray-500 text-sm">مع الجبنة</p></div>
        <div class="flex items-center gap-3"><span class="font-bold text-green-700">20 ﷼</span><button class="bg-indigo-600 text-white w-8 h-8 rounded-full"><i class="fas fa-plus"></i></button></div>
      </div>
      <!-- المزيد من المنتجات -->
    </div>
    <div class="mt-8 bg-white p-4 rounded-xl shadow">
      <h2 class="font-bold">سلة المشتريات</h2>
      <div id="cartSummary" class="text-sm text-gray-500">لا توجد عناصر</div>
      <button class="w-full bg-green-600 text-white py-2 rounded-lg mt-4">إتمام الطلب</button>
    </div>
  </div>
</body>
</html>
