<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الدخول - نظام المطاعم</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="bg-gradient-to-br from-indigo-600 to-purple-700 h-screen flex items-center justify-center font-sans">
  <div class="bg-white rounded-3xl shadow-2xl p-8 w-full max-w-md mx-4">
    <div class="text-center mb-8">
      <i class="fas fa-utensils text-5xl text-indigo-600 mb-3"></i>
      <h2 class="text-2xl font-bold text-gray-800" data-i18n="loginTitle">تسجيل الدخول</h2>
      <p class="text-gray-500 mt-2" data-i18n="loginSub">أهلاً بك في نظام إدارة المطاعم</p>
    </div>
    <form id="loginForm" class="space-y-5">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">البريد الإلكتروني</label>
        <input type="email" id="email" required class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-transparent" placeholder="example@restaurant.com">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">كلمة المرور</label>
        <div class="relative">
          <input type="password" id="password" required class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-indigo-500" placeholder="••••••••">
          <button type="button" class="absolute left-3 top-3 text-gray-400 hover:text-gray-600" onclick="togglePassword()"><i class="fas fa-eye"></i></button>
        </div>
      </div>
      <div class="flex justify-between items-center text-sm">
        <label class="flex items-center gap-1"><input type="checkbox"> تذكرني</label>
        <a href="#" class="text-indigo-600 hover:underline">نسيت كلمة المرور؟</a>
      </div>
      <button type="submit" class="w-full bg-indigo-600 text-white py-3 rounded-xl font-bold hover:bg-indigo-700 transition">دخول</button>
    </form>
    <p class="mt-4 text-center text-sm text-gray-500">ليس لديك حساب؟ <a href="#" class="text-indigo-600">سجل الآن</a></p>
    <div class="mt-4 text-center">
      <button onclick="switchLang()" class="text-gray-400 hover:text-gray-600 text-sm"><i class="fas fa-globe"></i> English</button>
    </div>
  </div>
  <script>
    function togglePassword() { /* ... */ }
    function switchLang() { /* ... */ }
  </script>
</body>
</html>
