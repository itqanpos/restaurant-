<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إدارة المخزون</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="bg-gray-100 p-6 font-sans">
  <div class="max-w-6xl mx-auto">
    <div class="flex justify-between items-center mb-8">
      <h1 class="text-2xl font-bold"><i class="fas fa-boxes text-indigo-600"></i> المخزون</h1>
      <button class="bg-indigo-600 text-white px-4 py-2 rounded-lg"><i class="fas fa-plus"></i> إضافة مادة</button>
    </div>
    <div class="bg-white rounded-xl shadow overflow-hidden">
      <table class="w-full text-sm">
        <thead class="bg-gray-50">
          <tr><th class="p-3 text-right">المادة</th><th class="p-3">الكمية</th><th class="p-3">الوحدة</th><th class="p-3">الحد الأدنى</th><th class="p-3">الحالة</th></tr>
        </thead>
        <tbody>
          <tr class="border-t"><td class="p-3 font-medium">لحم بقري</td><td class="p-3">12.5</td><td class="p-3">كغم</td><td class="p-3">5</td><td class="p-3"><span class="bg-green-100 text-green-800 px-2 py-1 rounded-full">متوفر</span></td></tr>
          <tr class="border-t"><td class="p-3 font-medium">زيت قلي</td><td class="p-3 text-red-600 font-bold">2</td><td class="p-3">لتر</td><td class="p-3">10</td><td class="p-3"><span class="bg-red-100 text-red-800 px-2 py-1 rounded-full">منخفض</span></td></tr>
        </tbody>
      </table>
    </div>
  </div>
</body>
</html>
