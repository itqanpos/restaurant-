<div class="min-h-full flex items-center justify-center bg-gradient-to-br from-indigo-600 to-purple-700 p-4">
  <div class="bg-white rounded-3xl shadow-2xl p-8 w-full max-w-md">
    <div class="text-center mb-6">
      <div class="w-16 h-16 bg-indigo-100 rounded-full flex items-center justify-center mx-auto mb-4">
        <i class="fas fa-utensils text-2xl text-indigo-600"></i>
      </div>
      <h2 class="text-2xl font-bold text-gray-800">نظام المطاعم</h2>
      <p class="text-gray-500 mt-1">مرحباً بك</p>
    </div>

    <div class="flex mb-6 bg-gray-100 rounded-xl p-1">
      <button id="tabLogin" class="flex-1 py-2 rounded-lg text-sm font-medium bg-white shadow transition">
        تسجيل الدخول
      </button>
      <button id="tabSignup" class="flex-1 py-2 rounded-lg text-sm font-medium text-gray-500 transition">
        إنشاء حساب
      </button>
    </div>

    <form id="loginForm" class="space-y-4">
      <div class="relative">
        <i class="fas fa-envelope absolute right-3 top-3.5 text-gray-400"></i>
        <input type="email" id="loginEmail" placeholder="البريد الإلكتروني" required
          class="w-full pr-10 pl-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-indigo-500">
      </div>
      <div class="relative">
        <i class="fas fa-lock absolute right-3 top-3.5 text-gray-400"></i>
        <input type="password" id="loginPassword" placeholder="كلمة المرور" required
          class="w-full pr-10 pl-10 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-indigo-500">
        <button type="button" id="togglePassword" class="absolute left-3 top-3.5 text-gray-400 hover:text-gray-600">
          <i class="fas fa-eye"></i>
        </button>
      </div>
      <div class="flex justify-between items-center text-sm">
        <label class="flex items-center gap-1 cursor-pointer">
          <input type="checkbox" class="rounded"> تذكرني
        </label>
        <a href="#" id="forgotLink" class="text-indigo-600 hover:underline">نسيت كلمة المرور؟</a>
      </div>
      <div id="loginError" class="text-red-500 text-sm hidden"></div>
      <button type="submit" class="w-full bg-indigo-600 text-white py-3 rounded-xl font-bold hover:bg-indigo-700 transition">
        دخول
      </button>
    </form>

    <form id="signupForm" class="space-y-4 hidden">
      <div class="relative">
        <i class="fas fa-user absolute right-3 top-3.5 text-gray-400"></i>
        <input type="text" id="signupName" placeholder="الاسم الكامل" required
          class="w-full pr-10 pl-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-indigo-500">
      </div>
      <div class="relative">
        <i class="fas fa-envelope absolute right-3 top-3.5 text-gray-400"></i>
        <input type="email" id="signupEmail" placeholder="البريد الإلكتروني" required
          class="w-full pr-10 pl-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-indigo-500">
      </div>
      <div class="relative">
        <i class="fas fa-lock absolute right-3 top-3.5 text-gray-400"></i>
        <input type="password" id="signupPassword" placeholder="كلمة المرور (6+ أحرف)" required
          class="w-full pr-10 pl-10 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-indigo-500">
        <button type="button" id="toggleSignupPassword" class="absolute left-3 top-3.5 text-gray-400 hover:text-gray-600">
          <i class="fas fa-eye"></i>
        </button>
      </div>
      <div id="signupError" class="text-red-500 text-sm hidden"></div>
      <button type="submit" class="w-full bg-green-600 text-white py-3 rounded-xl font-bold hover:bg-green-700 transition">
        إنشاء حساب
      </button>
    </form>
  </div>
</div>
