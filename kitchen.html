<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>شاشة المطبخ</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="bg-gray-900 text-white h-screen p-4 font-sans">
  <div class="flex justify-between items-center mb-6">
    <h1 class="text-2xl font-bold"><i class="fas fa-fire text-orange-500"></i> شاشة المطبخ</h1>
    <div class="text-lg"><span id="clock">12:00</span></div>
  </div>
  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4" id="ordersContainer">
    <!-- الطلب -->
    <div class="bg-gray-800 rounded-xl p-4 border-2 border-orange-500 order-card" data-status="new">
      <div class="flex justify-between">
        <span class="font-bold text-lg">طلب #105</span>
        <span class="text-sm text-gray-400">منذ 3 دقائق</span>
      </div>
      <ul class="my-3 space-y-2">
        <li class="flex justify-between"><span>برجر دجاج</span><span class="text-orange-400">×2</span></li>
        <li class="flex justify-between"><span>بطاطس مقلية</span><span class="text-orange-400">×1</span></li>
      </ul>
      <div class="flex gap-2 mt-3">
        <button onclick="updateStatus(this, 'preparing')" class="flex-1 bg-blue-600 py-2 rounded-lg">بدء التحضير</button>
        <button onclick="updateStatus(this, 'ready')" class="flex-1 bg-green-600 py-2 rounded-lg">جاهز</button>
      </div>
    </div>
  </div>
  <audio id="newOrderSound" src="https://actions.google.com/sounds/v1/alarms/beep_short.ogg" preload="auto"></audio>
  <script>
    // تحديث الساعة وربط Supabase لاستقبال الطلبات الجديدة
    setInterval(() => document.getElementById('clock').innerText = new Date().toLocaleTimeString('ar-SA'), 1000);
    function updateStatus(btn, status) {
      const card = btn.closest('.order-card');
      card.dataset.status = status;
      card.classList.toggle('border-orange-500', status === 'new');
      card.classList.toggle('border-blue-500', status === 'preparing');
      card.classList.toggle('border-green-500', status === 'ready');
    }
    // محاكاة وصول طلب جديد
    setTimeout(() => document.getElementById('newOrderSound').play(), 5000);
  </script>
</body>
</html>
