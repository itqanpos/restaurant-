<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الإعدادات</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="bg-gray-100 p-6 font-sans">
  <div class="max-w-4xl mx-auto">
    <h1 class="text-2xl font-bold mb-6"><i class="fas fa-cog"></i> إعدادات المطعم</h1>
    <div class="bg-white rounded-xl shadow p-6 space-y-6">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div><label class="block text-sm font-medium mb-1">اسم المطعم</label><input type="text" value="مطعم العائلة" class="w-full border p-2 rounded-lg"></div>
        <div><label class="block text-sm font-medium mb-1">البريد الإلكتروني</label><input type="email" class="w-full border p-2 rounded-lg"></div>
        <div><label class="block text-sm font-medium mb-1">العملة الافتراضية</label><select class="w-full border p-2 rounded-lg"><option>SAR</option><option>USD</option></select></div>
        <div><label class="block text-sm font-medium mb-1">نسبة الضريبة %</label><input type="number" value="15" class="w-full border p-2 rounded-lg"></div>
      </div>
      <button class="bg-indigo-600 text-white px-6 py-2 rounded-lg">حفظ التغييرات</button>
    </div>
    <!-- إدارة الفروع -->
    <div class="bg-white rounded-xl shadow p-6 mt-6">
      <h2 class="font-bold text-lg mb-4">الفروع</h2>
      <div class="space-y-3">
        <div class="flex justify-between items-center border p-3 rounded-lg"><span>الفرع الرئيسي - الرياض</span><button class="text-red-500"><i class="fas fa-trash"></i></button></div>
        <button class="text-indigo-600"><i class="fas fa-plus"></i> إضافة فرع</button>
      </div>
    </div>
  </div>
</body>
</html>
