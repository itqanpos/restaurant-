<div>
  <h2 class="text-2xl font-bold mb-6">الخصومات والعروض</h2>
  <div id="discountsList"></div>
  <button onclick="addDiscount()" class="bg-indigo-600 text-white px-4 py-2 rounded-lg mt-4">إضافة خصم</button>
</div>
<script>
  window.initDiscounts = function() { loadDiscounts(); };
  async function loadDiscounts() {
    const container = document.getElementById('discountsList');
    try {
      const discounts = await window.Api.getDiscounts(App.restaurant.id);
      container.innerHTML = discounts.map(d => `
        <div class="bg-white p-3 rounded-lg shadow mb-2 flex justify-between items-center">
          <div><span class="font-bold">${d.code || 'بدون كود'}</span><span class="text-sm text-gray-500"> - ${d.type === 'percentage' ? d.value + '%' : d.value + ' ج.م'}</span></div>
          <div><button onclick="deleteDiscount('${d.id}')" class="text-red-500"><i class="fas fa-trash"></i></button></div>
        </div>
      `).join('');
    } catch (e) { container.innerHTML = '<p class="text-red-500">فشل تحميل الخصومات</p>'; }
  }
  window.addDiscount = function() {
    const code = prompt('كود الخصم (اختياري):');
    const type = confirm('نسبة مئوية؟') ? 'percentage' : 'fixed';
    const value = parseFloat(prompt('قيمة الخصم:')); if (isNaN(value)) return;
    supabase.from('discounts').insert({ restaurant_id: App.restaurant.id, code, type, value, is_active: true }).then(() => loadDiscounts());
  };
  window.deleteDiscount = function(id) {
    supabase.from('discounts').update({ is_active: false }).eq('id', id).then(() => loadDiscounts());
  };
</script>
