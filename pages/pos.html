<div class="flex h-full -m-6">
  <!-- جهة المنتجات -->
  <div class="flex-1 p-6">
    <div class="flex gap-2 mb-4">
      <select id="orderType" class="border rounded-lg p-2 text-sm">
        <option value="dine_in">داخل المطعم</option>
        <option value="takeaway">تيك أواي</option>
        <option value="delivery">دليفري</option>
      </select>
      <input type="text" id="tableNo" placeholder="رقم الطاولة" class="border rounded-lg p-2 w-24 text-sm">
    </div>
    <div id="productGrid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3 overflow-y-auto" style="max-height: calc(100vh - 200px);"></div>
  </div>

  <!-- سلة المشتريات -->
  <div class="w-96 bg-white border-r flex flex-col">
    <div class="p-4 border-b font-bold text-lg">الطلب الحالي</div>
    <div id="cartContainer" class="flex-1 overflow-y-auto p-4 space-y-3"></div>
    <div class="p-4 border-t bg-gray-50 space-y-2">
      <div class="flex justify-between"><span>المجموع</span><span id="posSubtotal">0.00</span></div>
      <div class="flex justify-between"><span>الضريبة</span><span id="posTax">0.00</span></div>
      <div class="flex justify-between font-bold text-lg"><span>الإجمالي</span><span id="posTotal">0.00</span></div>
      <button id="placeOrderBtn" class="w-full bg-indigo-600 text-white py-3 rounded-xl font-bold mt-2">إتمام الطلب</button>
    </div>
  </div>
</div>
