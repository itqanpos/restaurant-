<div class="flex h-full -m-6">
  <!-- منطقة المنتجات -->
  <div class="flex-1 flex flex-col p-6">
    <!-- أزرار نوع الطلب -->
    <div class="flex gap-2 mb-4 flex-wrap">
      <button id="btnDineIn" class="order-type-btn bg-indigo-600 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-indigo-700 transition">
        <i class="fas fa-utensils"></i> داخل المطعم
      </button>
      <button id="btnTakeaway" class="order-type-btn bg-white border border-gray-300 px-4 py-2 rounded-lg text-sm hover:bg-gray-100 transition">
        <i class="fas fa-shopping-bag"></i> تيك أواي
      </button>
      <button id="btnDelivery" class="order-type-btn bg-white border border-gray-300 px-4 py-2 rounded-lg text-sm hover:bg-gray-100 transition">
        <i class="fas fa-motorcycle"></i> دليفري
      </button>
    </div>

    <!-- شريط التصنيفات -->
    <div id="categoryFilters" class="flex gap-2 mb-4 flex-wrap"></div>

    <!-- شبكة المنتجات -->
    <div id="productGrid" class="flex-1 overflow-y-auto grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-3"></div>
  </div>

  <!-- سلة المشتريات -->
  <div class="w-80 lg:w-96 bg-white border-r flex flex-col shadow-lg">
    <div class="p-4 border-b font-bold text-lg flex justify-between items-center">
      <span>الطلب الحالي</span>
      <button onclick="App.clearCart()" class="text-red-500 text-sm"><i class="fas fa-trash"></i></button>
    </div>

    <!-- بيانات الطلب (طاولة / عميل) -->
    <div id="orderInfoBar" class="px-4 py-2 bg-gray-50 border-b text-sm text-gray-600"></div>

    <!-- عناصر السلة -->
    <div id="cartItems" class="flex-1 overflow-y-auto p-4 space-y-3"></div>

    <!-- حقل الخصم -->
    <div class="px-4 py-2 border-t flex gap-2">
      <input type="text" id="discountCode" placeholder="كود الخصم" class="flex-1 border rounded-lg p-2 text-sm">
      <button id="applyDiscountBtn" class="bg-gray-200 px-3 py-2 rounded-lg text-sm hover:bg-gray-300">تطبيق</button>
    </div>

    <!-- ملخص السلة وأزرار الدفع -->
    <div class="border-t p-4 bg-gray-50 space-y-2">
      <div class="flex justify-between text-sm"><span>المجموع</span><span id="posSubtotal">0.00 ج.م</span></div>
      <div class="flex justify-between text-sm"><span>الضريبة (14%)</span><span id="posTax">0.00 ج.م</span></div>
      <div class="flex justify-between font-bold text-lg"><span>الإجمالي</span><span id="posTotal">0.00 ج.م</span></div>

      <div class="flex gap-2 mt-3">
        <button id="holdOrderBtn" class="flex-1 bg-yellow-100 text-yellow-800 py-2 rounded-lg text-sm hover:bg-yellow-200">
          <i class="fas fa-pause"></i> تعليق
        </button>
        <button id="recallOrderBtn" class="flex-1 bg-blue-100 text-blue-800 py-2 rounded-lg text-sm hover:bg-blue-200">
          <i class="fas fa-history"></i> استرجاع
        </button>
      </div>

      <!-- أزرار الدفع -->
      <div class="grid grid-cols-3 gap-2 mt-2">
        <button id="payCashBtn" class="bg-green-600 text-white p-2 rounded-lg text-sm font-medium hover:bg-green-700">F1 نقداً</button>
        <button id="payVisaBtn" class="bg-blue-600 text-white p-2 rounded-lg text-sm font-medium hover:bg-blue-700">F2 فيزا</button>
        <button id="payWalletBtn" class="bg-purple-600 text-white p-2 rounded-lg text-sm font-medium hover:bg-purple-700">F3 محفظة</button>
      </div>

      <button id="splitBillBtn" class="w-full bg-gray-200 py-2 rounded-lg text-sm mt-2">
        <i class="fas fa-divide"></i> تقسيم الفاتورة
      </button>
    </div>
  </div>
</div>

<!-- حاوية المودالات -->
<div id="posModalsContainer"></div>
