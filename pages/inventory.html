<div>
  <h2 class="text-2xl font-bold mb-6">إدارة المخزون</h2>
  <button onclick="openAddItemModal()" class="bg-indigo-600 text-white px-4 py-2 rounded-lg mb-4"><i class="fas fa-plus"></i> إضافة مادة</button>
  <table class="w-full bg-white rounded-xl shadow">
    <thead class="bg-gray-50"><tr><th class="p-3">المادة</th><th>الكمية</th><th>الوحدة</th><th>الحد</th><th>الحالة</th><th>إجراءات</th></tr></thead>
    <tbody id="inventoryBody"><tr><td colspan="6" class="text-center py-4">جاري التحميل...</td></tr></tbody>
  </table>
</div>
<script>
  window.initInventory = function() { renderInventoryTable(); };
  async function renderInventoryTable() {
    const tbody = document.getElementById('inventoryBody');
    try {
      if (!App.inventory.length) await App.loadRestaurantData();
      const items = App.inventory;
      tbody.innerHTML = items.map(item => `
        <tr class="border-t">
          <td class="p-3">${item.name}</td>
          <td class="p-3 ${item.current_quantity <= item.min_quantity ? 'text-red-600 font-bold' : ''}">${item.current_quantity}</td>
          <td class="p-3">${item.unit}</td>
          <td class="p-3">${item.min_quantity}</td>
          <td class="p-3"><span class="px-2 py-1 rounded-full text-xs font-medium ${item.current_quantity <= item.min_quantity ? 'bg-red-100 text-red-800' : 'bg-green-100 text-green-800'}">${item.current_quantity <= item.min_quantity ? 'منخفض' : 'متوفر'}</span></td>
          <td class="p-3"><button onclick="editItem('${item.id}')" class="text-blue-600 mr-2"><i class="fas fa-edit"></i></button><button onclick="deleteItem('${item.id}')" class="text-red-500"><i class="fas fa-trash"></i></button></td>
        </tr>
      `).join('');
    } catch (e) { tbody.innerHTML = '<tr><td colspan="6" class="text-center py-4 text-red-500">فشل تحميل المخزون</td></tr>'; }
  }
  window.openAddItemModal = function() {
    const name = prompt('اسم المادة:'); if (!name) return;
    const qty = parseFloat(prompt('الكمية الحالية:')); if (isNaN(qty)) return;
    const unit = prompt('الوحدة (كغم، لتر...):'); if (!unit) return;
    const min = parseFloat(prompt('الحد الأدنى:')); if (isNaN(min)) return;
    window.Api.addInventoryItem({ restaurant_id: App.restaurant.id, name, unit, current_quantity: qty, min_quantity: min }).then(() => {
      App.loadRestaurantData().then(renderInventoryTable);
    });
  };
  window.editItem = function(id) {
    const item = App.inventory.find(i => i.id === id); if (!item) return;
    const newQty = parseFloat(prompt('الكمية الجديدة:', item.current_quantity)); if (isNaN(newQty)) return;
    window.Api.updateInventoryItem(id, { current_quantity: newQty }).then(() => App.loadRestaurantData().then(renderInventoryTable));
  };
  window.deleteItem = function(id) {
    if (!confirm('حذف هذه المادة؟')) return;
    window.Api.updateInventoryItem(id, { is_active: false }).then(() => App.loadRestaurantData().then(renderInventoryTable));
  };
</script>
