<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة التحكم</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-100 h-screen flex overflow-hidden font-sans">
  <!-- شريط جانبي -->
  <aside class="w-64 bg-indigo-900 text-white flex flex-col">
    <div class="p-5 text-center border-b border-indigo-800">
      <i class="fas fa-utensils text-3xl mb-2"></i>
      <h1 class="text-lg font-bold">مطعم العائلة</h1>
    </div>
    <nav class="flex-1 space-y-1 p-3">
      <a href="#" class="flex items-center gap-3 px-4 py-3 rounded-lg bg-indigo-800"><i class="fas fa-th-large"></i> الرئيسية</a>
      <a href="#" class="flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-indigo-800"><i class="fas fa-cash-register"></i> الكاشير</a>
      <a href="#" class="flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-indigo-800"><i class="fas fa-fire"></i> المطبخ</a>
      <a href="#" class="flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-indigo-800"><i class="fas fa-box"></i> المخزون</a>
      <a href="#" class="flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-indigo-800"><i class="fas fa-chart-bar"></i> التقارير</a>
    </nav>
  </aside>
  <!-- محتوى -->
  <main class="flex-1 overflow-y-auto p-6">
    <!-- صف البطاقات -->
    <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">
      <div class="bg-white p-4 rounded-xl shadow"><span class="text-gray-500">مبيعات اليوم</span><h3 class="text-2xl font-bold">1,250 ﷼</h3></div>
      <div class="bg-white p-4 rounded-xl shadow"><span class="text-gray-500">عدد الطلبات</span><h3 class="text-2xl font-bold">34</h3></div>
      <div class="bg-white p-4 rounded-xl shadow"><span class="text-gray-500">متوسط الطلب</span><h3 class="text-2xl font-bold">36.7 ﷼</h3></div>
      <div class="bg-white p-4 rounded-xl shadow"><span class="text-gray-500">منتجات منخفضة</span><h3 class="text-2xl font-bold text-red-500">5</h3></div>
    </div>
    <!-- رسم بياني + أحدث الطلبات -->
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-4">
      <div class="lg:col-span-2 bg-white p-4 rounded-xl shadow"><canvas id="salesChart" height="200"></canvas></div>
      <div class="bg-white p-4 rounded-xl shadow">
        <h3 class="font-bold mb-3">أحدث الطلبات</h3>
        <div class="space-y-3">
          <div class="flex justify-between text-sm"><span>طلب #102</span><span class="text-green-600">45 ﷼</span></div>
          <div class="flex justify-between text-sm"><span>طلب #101</span><span class="text-green-600">120 ﷼</span></div>
        </div>
      </div>
    </div>
  </main>
  <script>
    // بيانات وهمية للرسم
    new Chart(document.getElementById('salesChart'), { type: 'line', data: { labels: ['', '', ''], datasets: [{ label: 'مبيعات', data: [12, 19, 3] }] } });
  </script>
</body>
</html>
